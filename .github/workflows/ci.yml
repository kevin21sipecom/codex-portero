name: CI
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Native review gate
        if: ${{ hashFiles('/usr/local/bin/gentle-ai') != '' }}
        run: ./scripts/validate_gate.sh ${{ github.event_name == 'release' && 'release' || 'pre-pr' }}
